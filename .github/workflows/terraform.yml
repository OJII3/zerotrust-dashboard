name: OpenTofu

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.11.8
          tofu_wrapper: false

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init without backend
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

  plan-and-apply:
    name: Plan and apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    needs: validate

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.11.8
          tofu_wrapper: false

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ vars.TF_STATE_R2_BUCKET }}"
          key    = "${{ vars.TF_STATE_R2_KEY }}"
          region = "auto"

          endpoints = {
            s3 = "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }

          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          EOF

      - name: Write variables
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_APPLICATION_DOMAIN: ${{ vars.ACCESS_APPLICATION_DOMAIN }}
          ACCESS_POLICY_INCLUDE_JSON: ${{ vars.ACCESS_POLICY_INCLUDE_JSON }}
          WORKER_CUSTOM_DOMAIN_JSON: ${{ vars.WORKER_CUSTOM_DOMAIN_JSON }}
        run: |
          jq -n \
            --arg cloudflare_account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg access_application_domain "$ACCESS_APPLICATION_DOMAIN" \
            --arg access_policy_include_json "$ACCESS_POLICY_INCLUDE_JSON" \
            --arg worker_custom_domain_json "$WORKER_CUSTOM_DOMAIN_JSON" \
            '({
              cloudflare_account_id: $cloudflare_account_id,
              access_application_domain: $access_application_domain,
              access_policy_include: ($access_policy_include_json | fromjson)
            } + if $worker_custom_domain_json == "" then {} else {
              worker_custom_domain: ($worker_custom_domain_json | fromjson)
            } end)' > ci.auto.tfvars.json

      - name: Init
        run: tofu init -backend-config=backend.hcl

      - name: Validate
        run: tofu validate

      - name: Plan
        run: tofu plan -no-color -out=tfplan

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tofu apply -no-color -auto-approve tfplan
