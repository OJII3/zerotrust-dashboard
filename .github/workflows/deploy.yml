name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run check

      - name: Prepare Worker runtime secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bun -e "await Bun.write('.wrangler-secrets.json', JSON.stringify({ CF_API_TOKEN: Bun.env.CF_API_TOKEN }))"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --keep-vars
            --secrets-file .wrangler-secrets.json
            --var CF_ACCOUNT_ID:${{ vars.CF_ACCOUNT_ID }}
            --var CF_ACCESS_TEAM_DOMAIN:${{ vars.CF_ACCESS_TEAM_DOMAIN }}
            --var CF_ACCESS_AUD:${{ vars.CF_ACCESS_AUD }}
